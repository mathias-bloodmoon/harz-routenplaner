<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Kostenloser Wander-Routenplaner für den Harz" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Harz Routenplaner</title>
  </head>
  <body>
    <div class="layout">
      <aside class="panel" id="panel" aria-labelledby="panel-title">
        <div class="panel-header">
          <button
            type="button"
            class="icon-button panel-toggle"
            id="panel-toggle"
            aria-controls="panel-body"
            aria-expanded="true"
            data-i18n-attr="aria-label:panel.collapse;title:panel.collapse"
          >
            <span aria-hidden="true" class="panel-toggle-icon"></span>
          </button>
          <h1 id="panel-title" data-i18n="app.title">Harz Routenplaner</h1>
          <button
            type="button"
            class="lang-toggle"
            id="lang-toggle"
            data-i18n="lang.switch"
            data-i18n-attr="aria-label:lang.switchLabel"
          >
            EN
          </button>
        </div>
        <div class="panel-body" id="panel-body">
          <p class="intro" data-i18n="panel.intro"></p>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <section class="section" aria-labelledby="wp-title">
            <div class="section-head">
              <h2 id="wp-title" tabindex="-1" data-i18n="waypoints.title"></h2>
              <span id="wp-count" class="count"></span>
            </div>
            <p id="wp-empty" class="hint" data-i18n="waypoints.empty"></p>
            <ol id="wp-list" class="wp-list"></ol>
            <p id="wp-hint" class="hint"></p>
            <div class="toolbar" id="wp-toolbar">
              <button type="button" class="button" id="wp-reverse" data-i18n="waypoints.reverse"></button>
              <button type="button" class="button" id="wp-clear" data-i18n="waypoints.clear"></button>
            </div>
            <button
              type="button"
              class="button primary wide"
              id="route-calc"
              data-i18n="routes.calculate"
            ></button>
          </section>
          <section class="section" id="routes-section" aria-labelledby="routes-title" hidden>
            <h2 id="routes-title" tabindex="-1" data-i18n="routes.title"></h2>
            <p id="routes-note" class="hint" hidden></p>
            <ul id="route-cards" class="route-cards"></ul>
            <p class="hint signage" data-i18n="routes.signage"></p>
          </section>
          <section class="section" id="stamps-section" aria-labelledby="stamps-title" hidden>
            <h2 id="stamps-title" data-i18n="stamps.title"></h2>
            <label class="check">
              <input type="checkbox" id="stamps-toggle" checked />
              <span data-i18n="stamps.show"></span>
            </label>
            <fieldset id="booklet-filter" class="booklets">
              <legend data-i18n="stamps.booklets"></legend>
              <div id="booklet-list"></div>
            </fieldset>
            <p id="stamps-error" class="error" data-i18n="stamps.unavailable" hidden></p>
          </section>
        </div>
      </aside>
      <main class="map-wrap">
        <div id="map" role="region" data-i18n-attr="aria-label:map.label"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
