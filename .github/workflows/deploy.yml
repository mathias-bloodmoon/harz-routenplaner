name: Build and deploy

# main → multi-arch images (linux/amd64 + linux/arm64) on ghcr.io → deploy to nsc-demo over SSH → smoke test.
# Secrets (Settings → Secrets → Actions): DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS,
# CADDY_CONTAINER. Repository variable STAMPS_ENABLED (true/false) switches the stamp layer. See infra/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/mathias-bloodmoon

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml
    secrets: inherit

  images:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: harz-web
            dockerfile: apps/web/Dockerfile
          - name: harz-api
            dockerfile: apps/api/Dockerfile
          - name: harz-brouter
            dockerfile: infra/brouter/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:latest', env.REGISTRY, matrix.name) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://routing.pixelcenter.de
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  BatchMode yes\n' "$HOST" "$USER" > ~/.ssh/config
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Copy stack files
        run: |
          ssh prod 'mkdir -p /opt/harz-routenplaner/data/segments'
          scp infra/docker-compose.prod.yml prod:/opt/harz-routenplaner/docker-compose.yml
          scp infra/routing.caddy infra/env.production.example scripts/deploy/remote-deploy.sh \
              scripts/brouter/download-segments.sh prod:/opt/harz-routenplaner/
      # The stamp data is never committed or put into an image (data/README.md). If the stamp layer is on and the
      # server has no stamps.geojson yet, it is built once here and copied to the server.
      - name: Stamp data (only if enabled and missing on the server)
        if: vars.STAMPS_ENABLED == 'true'
        run: |
          if ssh prod 'test -f /opt/harz-routenplaner/data/stamps.geojson'; then echo "present on the server"; exit 0; fi
          corepack enable
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile --filter scripts...
          pnpm --filter scripts stamps:fetch-special
          pnpm --filter scripts stamps:build
          scp data/stamps.geojson prod:/opt/harz-routenplaner/data/stamps.geojson
      - name: Deploy
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh prod "sh /opt/harz-routenplaner/remote-deploy.sh '$TAG' '$CADDY' '$STAMPS'"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
          CADDY: ${{ secrets.CADDY_CONTAINER }}
          STAMPS: ${{ vars.STAMPS_ENABLED }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: HTTPS, pages and api
        run: |
          base=https://routing.pixelcenter.de
          for i in 1 2 3 4 5 6; do curl -sf "$base/" -o /dev/null && break; sleep 10; done
          curl -sf "$base/" | grep -q "<title>Harz Routenplaner</title>"
          curl -sf "$base/api/health" | grep -q '"status":"ok"'
          for page in impressum datenschutz datenquellen; do curl -sf "$base/$page" | grep -q 'src/pages/legal\|assets/'; done
          curl -sf "$base/config.json"; echo
          scripts/brouter/smoke-test.sh "$base"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Production E2E (map loads, route calculated, GPX downloads)
        run: pnpm e2e --grep @production --project desktop --project phone
        env:
          E2E_BASE_URL: https://routing.pixelcenter.de
          PRODUCTION_SMOKE: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-smoke
          path: apps/web/playwright-report/
          retention-days: 14
