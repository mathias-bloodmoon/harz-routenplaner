name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Docker Compose stack + Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: BRouter segments (cached, ~300 MB)
        id: segments
        uses: actions/cache@v6
        with:
          path: data/segments
          key: brouter-segments-E5_N50-E10_N50-v1
      - name: Download BRouter segments
        if: steps.segments.outputs.cache-hit != 'true'
        run: scripts/brouter/download-segments.sh
      - name: Start stack (docker compose)
        # Synthetic stamp data: the real data must not be published (data/README.md)
        run: docker compose -f infra/docker-compose.yml up --build --detach --wait --wait-timeout 180
        env:
          STAMPS_DATA_DIR: ../apps/web/e2e/fixtures
      - name: Smoke check stack
        run: |
          curl --fail --silent http://localhost/ | grep -q "<title>Harz Routenplaner</title>"
          curl --fail --silent http://localhost/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://localhost/config.json | grep -q '"stampsEnabled":true'
          curl --fail --silent http://localhost/data/stamps.geojson | grep -q FeatureCollection
      - name: Routing integration (real BRouter, sample tours)
        run: scripts/brouter/smoke-test.sh http://localhost
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright E2E against the compose stack
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost
      - name: Screenshots (1280 px and 390 px, real map tiles)
        run: pnpm e2e --grep screenshot
        env:
          E2E_BASE_URL: http://localhost
          E2E_REAL_TILES: "1"
          SCREENSHOTS: "1"
      - name: Memory use of the stack
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}"
      - name: Production default hides the stamp layer (STAMPS_ENABLED unset → false in the image)
        run: |
          docker compose -f infra/docker-compose.yml up --detach --wait --no-build harz-web
          curl --silent http://localhost/config.json | grep -q '"stampsEnabled":false'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/data/stamps.geojson)" = 404
        env:
          STAMPS_ENABLED: "false"
          STAMPS_DATA_DIR: ../apps/web/e2e/fixtures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright
          path: |
            apps/web/screenshots/
            apps/web/playwright-report/
          retention-days: 14
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
