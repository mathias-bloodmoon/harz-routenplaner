name: Server preflight

# Read-only check of the production server (nsc-demo) before deploying (CLAUDE.md "Shared server – hard rules",
# issue #7): NSC package 1.7e present (/opt/caddy-sites, Docker network "edge", Caddy imports the sites folder),
# app folder writable, memory and disk. Changes nothing on the server.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [m5-go-live]
    paths: [.github/workflows/preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Check server (read-only)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          CADDY: ${{ secrets.CADDY_CONTAINER }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$USER@$HOST" CADDY="$CADDY" sh -s <<'REMOTE'
          fail=0
          check() { if eval "$2" >/dev/null 2>&1; then echo "OK    $1"; else echo "MISS  $1"; fail=1; fi; }
          check "/opt/caddy-sites exists"                   "test -d /opt/caddy-sites"
          check "/opt/caddy-sites/routing.caddy writable"   "test -w /opt/caddy-sites/routing.caddy"
          check "/opt/harz-routenplaner writable"           "test -w /opt/harz-routenplaner"
          check "Docker network 'edge' exists"              "docker network inspect edge"
          check "Caddy container '$CADDY' running"          "docker inspect -f '{{.State.Running}}' $CADDY | grep -q true"
          check "Caddyfile imports /etc/caddy/sites/*.caddy" "docker exec $CADDY grep -q 'import /etc/caddy/sites/\*.caddy' /etc/caddy/Caddyfile"
          check "sites folder mounted into Caddy"           "docker inspect -f '{{range .Mounts}}{{.Destination}} {{end}}' $CADDY | grep -q /etc/caddy/sites"
          echo "--- memory / disk"
          free -m | head -2
          df -h /opt | tail -1
          echo "--- containers"
          docker ps --format '{{.Names}}  {{.Status}}'
          exit $fail
          REMOTE
