# Local stack: docker compose -f infra/docker-compose.yml up --build  →  http://localhost
# Needs the BRouter segments first: scripts/brouter/download-segments.sh (~300 MB, see infra/README.md).
# Production variant (network "edge", no published ports) follows with M5. Memory: 64 + 256 + 512 MB ≤ 1 GB.
name: harz-routenplaner

services:
  harz-web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ghcr.io/mathias-bloodmoon/harz-web:local
    ports:
      - "${WEB_PORT:-80}:8080"
    environment:
      # Local default: on. Production: false until the Harzer Wandernadel office has agreed in writing.
      STAMPS_ENABLED: ${STAMPS_ENABLED:-true}
    volumes:
      # data/stamps.geojson is generated locally (pnpm stamps:build) and never committed or baked into images
      - ${STAMPS_DATA_DIR:-../data}:/srv/data:ro
    depends_on:
      harz-api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

  harz-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: ghcr.io/mathias-bloodmoon/harz-api:local
    environment:
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROUTER_URL: http://brouter:17777
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      # proxies in front of the api: 1 = nginx (local); production (Caddy + nginx) uses 2
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    depends_on:
      brouter:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  brouter:
    build:
      context: ..
      dockerfile: infra/brouter/Dockerfile
    image: ghcr.io/mathias-bloodmoon/harz-brouter:local
    volumes:
      - ${SEGMENTS_DIR:-../data/segments}:/segments:ro
    ports:
      # local debugging only (e.g. scripts/brouter/record-fixtures.sh); bound to localhost
      - "127.0.0.1:${BROUTER_PORT:-17777}:17777"
    restart: unless-stopped
    mem_limit: 512m
